name: Validate rich translation fix

on:
  push:
    branches:
      - ci/rich-message-translation-entities-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit test and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;29.0.14206865 platforms;android-36'
      - name: Configure build
        run: |
          rm -f TMessagesProj/release.keystore
          keytool -genkeypair -keystore TMessagesProj/release.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=CI' -keyalg RSA -validity 10000
          cat >> local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          KEYSTORE_PASS=android
          ALIAS_NAME=androiddebugkey
          ALIAS_PASS=android
          EOF
      - name: Run regression tests
        run: ./gradlew :TMessagesProj:testNormalDebugUnitTest --tests 'tw.nekomimi.nekogram.helpers.TranslationEntityHandlingTest' --no-daemon --max-workers=2

  build:
    name: Staging build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;29.0.14206865 platforms;android-36'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Cython
        run: pip install Cython==0.29.37
      - name: Configure build
        run: |
          rm -f TMessagesProj/release.keystore
          keytool -genkeypair -keystore TMessagesProj/release.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=CI' -keyalg RSA -validity 10000
          cat >> local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          KEYSTORE_PASS=android
          ALIAS_NAME=androiddebugkey
          ALIAS_PASS=android
          EOF
      - name: Build staging APKs
        env:
          BUILD_TIMESTAMP: '0'
          COMMIT_ID: ${{ github.sha }}
        run: ./gradlew :TMessagesProj:assembleStaging --no-daemon
